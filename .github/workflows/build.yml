name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: リポジトリを取得
      uses: actions/checkout@v4

    - name: Python 3.11 をセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Poppler をダウンロードして配置
      run: |
        $url = "https://github.com/oschwartz10612/poppler-windows/releases/download/v24.02.0-0/Release-24.02.0-0.zip"
        Invoke-WebRequest -Uri $url -OutFile poppler.zip
        Expand-Archive -Path poppler.zip -DestinationPath C:\poppler -Force
        $bin = Get-ChildItem C:\poppler -Recurse -Filter "pdftoppm.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
        echo $bin | Out-File -Append -FilePath $env:GITHUB_PATH
        echo "POPPLER_BIN=$bin" | Out-File -Append -FilePath $env:GITHUB_ENV

    - name: 動作確認
      run: |
        pdftoppm -v

    - name: Pythonライブラリをインストール
      run: |
        pip install --upgrade pip
        pip install pikepdf pypdf pdf2image pillow paddleocr paddlepaddle pyinstaller tkinterdnd2

    - name: PaddleOCR モデルを事前ダウンロード
      env:
        PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      run: |
        python -c "
        import logging
        logging.getLogger('ppocr').setLevel(logging.ERROR)
        from paddleocr import PaddleOCR
        try:
            PaddleOCR(use_textline_orientation=True, lang='japan')
        except TypeError:
            PaddleOCR(use_angle_cls=True, lang='japan')
        "

    - name: build.spec を生成
      env:
        POPPLER_BIN: ${{ env.POPPLER_BIN }}
        PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      run: |
        python generate_spec.py

    - name: EXEをビルド
      run: |
        pyinstaller build.spec

    - name: ビルド成果物をアップロード
      uses: actions/upload-artifact@v4
      with:
        name: 橋梁点検PDFリンク追加ツール-Windows
        path: dist/橋梁点検PDFリンク追加ツール.exe
        retention-days: 30
